swagger: "2.0"
info:
  description: "TestBuDDy is a test management, requirement management, automation friendly tool."
  version: "1.0.0"
  title: "TestBuDDy"
  contact:
    email: "barbora.blozonova@gmail.com"
  license:
    name: "MIT licence"
host: "127.0.0.1:5000"
basePath: "/"
tags:

- name: "Swagger doc"
  description: "Show this Swagger page."

- name: "Demo Initialization"
  description: "Data Initialization for testing purposes."

- name: "User and role management"
  description: "Operations regarding to user."

- name: "Project management"
  description: "Operations regarding project."

- name: "Test library - plans and modules"
  description: "Operations regarding desgin of test plans and test modules."

- name: "Test library - cases and steps"
  description: "Operations regarding design of test cases, test steps and test step definitions."

- name: "Test execution - test run management and reporting"
  description: "Operations regarding execution of test runs (CI runs) and repository management."

- name: "Requirement management"
  description: "Operations regarding requirements, tags."

- name: "Incident management"
  description: "Operations regarding bugs (objects)."

schemes:
- "http"
paths:
  /:
    get:
      tags:
      - "Swagger doc"
      summary: "Show Swagger doc"
      description: ""
      produces:
      - "text/html"
      responses:
        200:
          description: "Shows Swagger page."
  /users:
    get:
      tags:
      - "User and role management"
      summary: "List all users"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      responses:
        404:
          description: "Users not found."
        200:
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                type: "array"
                items:
                  $ref: "#/definitions/User"
          description: "Operation successful. Returns users in JSON response."
    post:
      tags:
      - "User and role management"
      summary: "Create user"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "user info"
        in: "body"
        description: "User's information"
        required: true
        schema:
          type: "object"
          properties:
            username:
              type: "string"
            password:
              type: "string"
            name:
              type: "string"
            surname:
              type: "string"
      responses:
        200:
          description: "Operation successful. Returns user in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                $ref: "#/definitions/User"
        400:
          description: "Invalid body."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
  /users/{user_id}:
    get:
      tags:
      - "User and role management"
      summary: "Get user (by set path ID)"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      responses:
        404:
          description: "User not found."
        200:
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                $ref: "#/definitions/User"
          description: "Operation successful. Returns user in JSON response."
    put:
      tags:
      - "User and role management"
      summary: "Update user info"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      - name: "user info"
        in: "body"
        description: "User's information"
        required: true
        schema:
          type: "object"
          properties:
            username:
              type: "string"
            password:
              type: "string"
            name:
              type: "string"
            surname:
              type: "string"
      responses:
        200:
          description: "Operation successful. Returns updated user in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                $ref: "#/definitions/User"
        400:
          description: "Invalid body."
        404:
          description: "User not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
    delete:
      tags:
      - "User and role management"
      summary: "Delete user"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "string"
        required: true
      responses:
        200:
          description: "Operation successful."
        404:
          description: "User not found."
        500:
          description: "Operation failed."
  /users/{user_id}/assign-project:
    post:
      tags:
      - "User and role management"
      summary: "Assign project to user"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      - name: "project info"
        in: "body"
        description: "Project ID in JSON"
        required: true
        schema:
          type: "object"
          properties:
            project_id:
              type: "integer"
      responses:
        200:
          description: "Operation successful."
        400:
          description: "Invalid body."
        404:
          description: "User or project not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
    delete:
      tags:
      - "User and role management"
      summary: "Remove assigned project from user"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      - name: "project info"
        in: "body"
        description: "Project ID in JSON"
        required: true
        schema:
          type: "object"
          properties:
            project_id:
              type: "integer"
      responses:
        200:
          description: "Operation successful."
        400:
          description: "Invalid body."
        404:
          description: "User or project not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
  /users/{user_id}/assign-role:
    post:
      tags:
      - "User and role management"
      summary: "Assign role to user"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      - name: "role info"
        in: "body"
        description: "Role ID in JSON"
        required: true
        schema:
          type: "object"
          properties:
            role_id:
              type: "integer"
      responses:
        200:
          description: "Operation successful."
        400:
          description: "Invalid body."
        404:
          description: "User or role not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
    delete:
      tags:
      - "User and role management"
      summary: "Remove assigned role from user."
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      - name: "role info"
        in: "body"
        description: "Role ID in JSON"
        required: true
        schema:
          type: "object"
          properties:
            role_id:
              type: "integer"
      responses:
        200:
          description: "Operation successful."
        400:
          description: "Invalid body."
        404:
          description: "User or role not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
  /users/{user_id}/assign-testcase:
    post:
      tags:
      - "User and role management"
      summary: "Assign test case to user"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      - name: "test case info"
        in: "body"
        description: "Test case ID in JSON"
        required: true
        schema:
          type: "object"
          properties:
            testcase_id:
              type: "integer"
      responses:
        200:
          description: "Operation successful."
        400:
          description: "Invalid body."
        404:
          description: "User or test case not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
    delete:
      tags:
      - "User and role management"
      summary: "Remove assigned role from user"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "user_id"
        in: "path"
        type: "integer"
        required: true
      - name: "test case info"
        in: "body"
        description: "Test case ID in JSON"
        required: true
        schema:
          type: "object"
          properties:
            testcase_id:
              type: "integer"
      responses:
        200:
          description: "Operation successful."
        400:
          description: "Invalid body."
        404:
          description: "User or test case not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
  /users/roles:
    get:
      tags:
      - "User and role management"
      summary: "List all roles"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      responses:
        404:
          description: "Roles not found."
        200:
          description: "Operation successful. Returns roles in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                type: "array"
                items:
                  allOf:
                    - $ref: "#/definitions/Role"
                    - properties:
                        user_ids:
                          description: "Users having this role."
                          type: "array"
                          items:
                            type: "integer"
    post:
      tags:
      - "User and role management"
      summary: "Create role"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "role info"
        in: "body"
        description: "Role info in JSON"
        required: true
        schema:
          type: "object"
          properties:
            name:
              type: "string"
      responses:
        400:
          description: "Invalid body."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
        200:
          description: "Operation successful. Returns new role in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                $ref: "#/definitions/Role"
  /users/roles/{role_id}:
    get:
      tags:
      - "User and role management"
      summary: "Get role"
      description: ""
      parameters:
      - name: "role_id"
        in: "path"
        type: "integer"
        required: true
      produces:
      - "application/json"
      - "text/html"
      responses:
        404:
          description: "Role not found."
        200:
          description: "Operation successful. Returns role in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                type: "object"
                allOf:
                  - $ref: "#/definitions/Role"
                  - properties:
                      user_ids:
                        description: "Users having this role."
                        type: "array"
                        items:
                          type: "integer"
    put:
      tags:
      - "User and role management"
      summary: "Update role info"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "role_id"
        in: "path"
        type: "integer"
        required: true
      - name: "role info"
        in: "body"
        description: "Role information"
        required: true
        schema:
          type: "object"
          properties:
            name:
              type: "string"
      responses:
        200:
          description: "Operation successful. Returns updated role in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                type: "object"
                allOf:
                  - $ref: "#/definitions/Role"
                  - properties:
                      user_ids:
                        description: "Users having this role."
                        type: "array"
                        items:
                          type: "integer"
        400:
          description: "Invalid body."
        404:
          description: "Role not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
    delete:
      tags:
      - "User and role management"
      summary: "Delete role"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "role_id"
        in: "path"
        type: "integer"
        required: true
      responses:
        200:
          description: "Operation successful."
        404:
          description: "Role not found."
        500:
          description: "Operation failed."

  /init-data:
    post:
      tags:
      - "Demo Initialization"
      summary: "Initialize ALL data in correct order."
      description: "Calls: /init-users, /init-projects, /init-ci, /init-testlibrary, /init-requirements."
      produces:
      - "text/html"
      responses:
        200:
          description: "Operation successful."
        500:
          description: "Operation failed. Prints which endpoint failed. /clean-data recommended."
  /clean-data:
    post:
      tags:
      - "Demo Initialization"
      summary: "Cleans database data (not the connected repositories)."
      description: ""
      produces:
      - "text/html"
      responses:
        200:
          description: "Operation successful. All tables were removed."
        500:
          description: "Operation failed."
  /init-users:
    post:
      tags:
      - "Demo Initialization"
      summary: "Initialize users and roles."
      description: "(tables: user, role etc.)"
      produces:
      - "text/html"
      responses:
        200:
          description: "Operation successful. Test users initialized."
        500:
          description: "Operation failed."
  /init-projects:
    post:
      tags:
      - "Demo Initialization"
      summary: "Initialize projects"
      description: "(table: project)"
      produces:
      - "text/html"
      responses:
        200:
          description: "Operation successful. Test projects initialized."
        500:
          description: "Operation failed."
  /init-testlibrary:
    post:
      tags:
      - "Demo Initialization"
      summary: "Initialize test tables for test library"
      description: "(tables: test_plan, test_module,  gherkin_type etc.)."
      produces:
      - "text/html"
      responses:
        200:
          description: "Operation successful. Test library tables initialized."
        500:
          description: "Operation failed."
  /init-requirements:
    post:
      tags:
      - "Demo Initialization"
      summary: "Initialize test tables for requirement management"
      description: "(tables: tag, requirement)."
      produces:
      - "text/html"
      responses:
        200:
          description: "Operation successful. Requirement test tables initialized."
        500:
          description: "Operation failed."
  /init-ci:
    post:
      tags:
      - "Demo Initialization"
      summary: "Initialize tables needed for CI/CD management"
      description: "(tables: trigger type, result state)."
      produces:
      - "text/html"
      responses:
        200:
          description: "Operation successful. CI/CD needed tables initialized."
        500:
          description: "Operation failed."

  /projects:
    get:
      tags:
      - "Project management"
      summary: "List all projects"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      responses:
        404:
          description: "Projects not found."
        200:
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                type: "array"
                items:
                  $ref: "#/definitions/Project"
          description: "Operation successful. Returns projects in JSON response."
    post:
      tags:
      - "Project management"
      summary: "Create project and initialize its remote repository"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "project info"
        in: "body"
        description: "Project information"
        required: true
        schema:
          type: "object"
          required:
          - name
          - repo_url
          - ci_params
          properties:
            name:
              type: "string"
              description: "unique project name"
            repo_url:
              type: "string"
            language_processor:
              type: "string"
              description: "currently supported: 'java-jbehave'"
            ci_communicator:
              type: "string"
              description: "currently supported: 'gitlab'"
            ci_params:
              type: "object"
              description: "required for Gitlab CI integration"
              required:
              - key
              properties:
                key:
                  type: "string"
                  description: "generated token for the repository"
            issue_tracker:
              type: "string"
            issue_tracker_params:
              type: "object"
              description: "required for JIRA integration"
              required:
              - server
              - username
              - password
              - project_shortcut
              properties:
                server:
                  type: "string"
                username:
                  type: "string"
                password:
                  type: "string"
                project_shortcut:
                  type: "string"
      responses:
        200:
          description: "Operation successful. Returns Project in JSON response. Affects repository."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                  $ref: "#/definitions/Project"
        400:
          description: "Invalid body."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
  /projects/{proj_id}:
    get:
      tags:
      - "Project management"
      summary: "Get project (by set path ID)"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "proj_id"
        in: "path"
        type: "integer"
        required: true
      responses:
        404:
          description: "Project not found."
        200:
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                  $ref: "#/definitions/Project"
          description: "Operation successful. Returns project in JSON response."
    put:
      tags:
      - "Project management"
      summary: "Update project"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "proj_id"
        in: "path"
        type: "integer"
        required: true
      - name: "project info"
        in: "body"
        description: "Project information"
        required: true
        schema:
          type: "object"
          properties:
            name:
              type: "string"
            language_processor:
              type: "string"
            ci_params:
              type: "object"
              description: "required for Gitlab CI integration"
              required:
              - key
              properties:
                key:
                  type: "string"
            issue_tracker:
              type: "string"
            issue_tracker_params:
              type: "object"
              description: "required for JIRA integration"
              required:
              - server
              - username
              - password
              - project_shortcut
              properties:
                server:
                  type: "string"
                username:
                  type: "string"
                password:
                  type: "string"
                project_shortcut:
                  type: "string"
      responses:
        200:
          description: "Operation successful. Returns updated project in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                  $ref: "#/definitions/Project"
        400:
          description: "Invalid body."
        404:
          description: "Project not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
    delete:
      tags:
      - "Project management"
      summary: "Clean project repository and delete project"
      description: ""
      produces:
      - "text/html"
      parameters:
      - name: "proj_id"
        in: "path"
        type: "integer"
        required: true
      - name: "delete_project_in_dbs"
        description: "Delete project in database."
        in: "query"
        type: "boolean"
        default: false
      responses:
        200:
          description: "Operation successful."
        404:
          description: "Project not found."
        500:
          description: "Operation failed."

  /projects/plans:
    get:
      tags:
      - "Test library - plans and modules"
      summary: "List all test plans"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      responses:
        404:
          description: "Test plans not found."
        200:
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                type: "array"
                items:
                  $ref: "#/definitions/TestPlan"
          description: "Operation successful. Returns test plan in JSON response."
  /projects/{proj_id}/plans:
    get:
      tags:
      - "Test library - plans and modules"
      summary: "List all test plans from project"
      description: "At current a project can have max 1 test plan."
      parameters:
      - name: "proj_id"
        in: "path"
        type: "integer"
        required: true
      responses:
        404:
          description: "Test plans not found."
        200:
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                type: "array"
                items:
                  $ref: "#/definitions/TestPlan"
          description: "Operation successful. Returns test plans in JSON response."
    post:
      tags:
      - "Test library - plans and modules"
      summary: "Create test plan for project"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "proj_id"
        in: "path"
        type: "integer"
        required: true
      - name: "test plan info"
        in: "body"
        description: "Test plan information"
        required: true
        schema:
          type: "object"
          required:
          - name
          properties:
            name:
              type: "string"
            description:
              type: "string"
      responses:
        200:
          description: "Operation successful."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                $ref: "#/definitions/TestPlan"
        400:
          description: "Invalid body or project has already test plan."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."
  /projects/{proj_id}/plans/{tp_id}:
    get:
      tags:
      - "Test library - plans and modules"
      summary: "Get test plan from project"
      description: "At current a project can have max 1 test plan."
      parameters:
      - name: "proj_id"
        description: "project id"
        in: "path"
        type: "integer"
        required: true
      - name: "tp_id"
        description: "test plan id"
        in: "path"
        type: "integer"
        required: true
      responses:
        404:
          description: "Test plan or project not found."
        200:
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                $ref: "#/definitions/TestPlan"
          description: "Operation successful. Returns test plan in JSON response."
    put:
      tags:
      - "Test library - plans and modules"
      summary: "Update test plan info in project"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "proj_id"
        description: "project id"
        in: "path"
        type: "integer"
        required: true
      - name: "tp_id"
        description: "test plan id"
        in: "path"
        type: "integer"
        required: true
      - name: "test plan info"
        in: "body"
        description: "Role information"
        required: true
        schema:
          type: "object"
          properties:
            name:
              type: "string"
            description:
              type: "string"
      responses:
        200:
          description: "Operation successful. Returns updated test plan in JSON response."
          schema:
            type: "object"
            properties:
              message:
                type: "string"
              object:
                $ref: "#/definitions/TestPlan"
        400:
          description: "Invalid body."
        404:
          description: "Test plan or project not found."
        415:
          description: "Unsupported media type."
        500:
          description: "Operation failed."

  /projects/{proj_id}/plans/{tp_id}/mods:
    post:
      tags:
      - "Test library - plans and modules"
      summary: "Create test module for test plan"
      description: ""
      produces:
      - "application/json"
      - "text/html"
      parameters:
      - name: "proj_id"
        description: "project id"
        in: "path"
