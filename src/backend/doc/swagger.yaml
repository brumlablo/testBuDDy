definitions:
  Role:
    type: "object"
    required:
    - id
    - name
    properties:
      id:
        type: "integer"
      name:
        type: "string"

  User:
    type: "object"
    required:
    - id
    - name
    - roles
    properties:
      id:
        type: "integer"
      username:
        type: "string"
      name:
        type: "string"
      surname:
        type: "string"
      roles:
        type: "array"
        items:
          $ref: "#/definitions/Role"
      assigned_projects:
        type: "array"
        items:
          type: "integer"

  Project:
    type: "object"
    required:
    - id
    - name
    - repo_url
    - language_processor
    - ci_communicator
    - ci_params
    properties:
      id:
        type: "integer"
      name:
        type: "string"
      repo_url:
        type: "string"
      language_processor:
        type: "string"
      ci_communicator:
        type: "string"
      ci_params:
        type: "object"
        description: "required for Gitlab CI integration"
        required:
        - key
        properties:
          key:
            type: "string"
          proj_path:
            type: "string"
          server_base:
            type: "string"
          server_url:
            type: "string"
      issue_tracker:
        type: "string"
      issue_tracker_params:
        type: "object"
        description: "required for JIRA integration"
        required:
        - server
        - username
        - password
        - project_shortcut
        properties:
          server:
            type: "string"
          username:
            type: "string"
          password:
            type: "string"
          project_shortcut:
            type: "string"

  StepGherkinType:
    type: "object"
    required:
    - id
    - name
    properties:
      id:
        type: "integer"
      name:
        enum: ["Given", "When", "Then"]
        description: "Default basic Gherkin types."
        type: "string"

  TestStepDefinition:
    type: "object"
    required:
    - id
    - content
    - project
    - gherkin_type
    properties:
      id:
        type: "integer"
      content:
        type: "string"
      gherkin_type:
        type: "string"
        description: "expected name of step gherkin type"
      param_count:
        type: "integer"
      project:
        type: "object"
        properties:
          id:
            type: "integer"
          name:
            type: "string"

  TestStep:
    type: "object"
    required:
    - id
    - content
    - order
    - test_step_definition
    properties:
      id:
        type: "integer"
      content:
        type: "string"
      order:
        type: "integer"
      test_step_definition:
        $ref: "#/definitions/TestStepDefinition"

  TestCase:
    type: "object"
    required:
    - id
    - name
    properties:
      id:
        type: "integer"
      name:
        type: "string"
      priority:
        enum: ["high", "medium", "low"]
        description: "Default priority types, connected to Test Case."
        type: "string"
      scenario_name:
        type: "string"
        description: "also 'scenario_no_spaces' is used for filenames based on test case"
      steps:
        type: "array"
        items:
          $ref: "#/definitions/TestStep"

  TestModule:
    type: "object"
    required:
    - id
    - name
    - name_no_spaces
    properties:
      id:
        type: "integer"
      name:
        type: "string"
      name_no_spaces:
        description: "for file names based on module"
        type: "string"
      testcases:
        type: "array"
        items:
          $ref: "#/definitions/TestCase"

  TestPlan:
    type: "object"
    required:
    - id
    - project
    properties:
      id:
        type: "integer"
      name:
        type: "string"
      description:
        type: "string"
      project:
        type: "object"
        properties:
          id:
            type: "integer"
          name:
            type: "string"
      testmodules:
        type: "array"
        items:
          $ref: "#/definitions/TestModule"

  Bug_full:
    type: "object"
    required:
    - id
    - pipeline_id
    - trigger_type
    properties:
      id:
        type: "integer"
      link:
        type: "integer"
      status:
        type: "string"
      data:
        type: "string"
      ci_runs_affected:
        type: "array"
        items:
          $ref: "#/definitions/CIRun_full"

  Bug_base:
    type: "object"
    required:
    - id
    properties:
      id:
        type: "integer"
      link:
        type: "integer"
      status:
        type: "string"
      data:
        type: "string"
      ci_runs_affected:
        type: "array"
        items:
          type: "integer"

  CIRun_full:
    type: "object"
    required:
    - id
    - pipeline_id
    - trigger_type
    properties:
      id:
        type: "integer"
      pipeline_id:
        type: "integer"
      data:
        description: "JSON in string pipeline_id, commit_hash, status"
        type: "string"
      trigger_type:
        type: "string"
      bugs:
        type: "array"
        items:
          $ref: "#/definitions/Bug_full"

  CIRun_base:
    type: "object"
    required:
    - id
    - pipeline_id
    - trigger_type
    properties:
      id:
        type: "integer"
      pipeline_id:
        type: "integer"
      data:
        description: "JSON in string pipeline_id, commit_hash, status"
        type: "string"
      trigger_type:
        type: "string"
      bugs:
        type: "array"
        items:
          type: "integer"

  Report:
    type: "object"
    required:
    - id
    - ci_run
    properties:
      id:
        type: "integer"
      ci_run:
        type: "object"
        properties:
          id:
            type: "integer"
          pipeline_id:
            type: "integer"
          overall_result:
            type: "string"
      report_data:
        description: "JSON in string with 'result', 'test_cases'"
        type: "string"
  Tag:
    type: "object"
    required:
    - id
    - project_id
    properties:
      id:
        type: "integer"
      content:
        type: "string"
      category:
        type: "string"
      project_id:
        type: "string"
  Requirement_base:
    type: "object"
    required:
    - id
    - project_id
    properties:
      id:
        type: "integer"
      content:
        type: "string"
      project_id:
        type: "string"
      tags:
        type: "array"
        items:
          $ref: "#/definitions/Tag"
      project:
        type: "object"
        properties:
          id:
            type: "integer"
          name:
            type: "string"
      in_testcases:
        type: "array"
        items:
          type: "integer"

  Requirement_full:
    type: "object"
    required:
    - id
    - project_id
    properties:
      id:
        type: "integer"
      content:
        type: "string"
      project_id:
        type: "string"
      tags:
        type: "array"
        items:
          $ref: "#/definitions/Tag"
      project:
        type: "object"
        properties:
          id:
            type: "integer"
          name:
            type: "string"
      in_testcases:
        type: "array"
        items:
          $ref: "#/definitions/TestCase"
